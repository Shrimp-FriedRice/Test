<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Identitas Saya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            width: 320px;
            background-color: #ffffff;
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            position: relative;
        }

        /* --- BAGIAN ATAS --- */
        .top-section {
            background-color: #e3eaf2;
            padding: 25px 20px 15px 20px;
            text-align: center;
            border-bottom: 2px solid #333;
            position: relative;
        }

        /* Frame berbentuk Arch / Lengkungan */
        .avatar-arch-frame {
            width: 110px;
            height: 130px;
            border: 2px solid #333;
            border-radius: 55px 55px 0 0; /* Lengkung atas khas sketsa */
            margin: 0 auto;
            background-color: #fff;
            overflow: hidden; /* Memastikan foto terpotong sesuai bentuk arch */
        }

        /* Pengaturan Gambar Foto */
        .avatar-arch-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Agar gambar pas tanpa merusak proporsi */
            display: block;
        }

        /* Pot Tanaman (Kiri) & Lampu (Kanan) berbasis CSS */
        .plant-pot {
            position: absolute;
            bottom: 12px;
            left: 20px;
            width: 20px;
            height: 25px;
            border: 2px solid #333;
            border-radius: 0 0 4px 4px;
            background-color: #fff;
        }
        .plant-pot::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 2px;
            width: 12px;
            height: 10px;
            border-top: 2px solid #333;
            border-radius: 50% 50% 0 0;
        }

        .lamp {
            position: absolute;
            bottom: 12px;
            right: 20px;
            width: 16px;
            height: 25px;
            border: 2px solid #333;
            border-radius: 3px;
            background-color: #fff;
        }

        /* --- BAGIAN BAWAH --- */
        .bottom-section {
            display: flex;
            padding: 15px;
            gap: 15px;
            align-items: flex-start;
            position: relative;
        }

        .illustration-box {
            width: 85px;
            height: 95px;
            border: 2px dashed #888;
            border-radius: 6px;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #666;
            text-align: center;
            flex-shrink: 0;
        }

        .info {
            font-size: 13px;
            line-height: 1.4;
            color: #333;
            padding-right: 20px;
        }

        .info p {
            margin: 3px 0;
        }

        /* Bulan Sabit Polos */
        .faceless-moon {
            position: absolute;
            bottom: 12px;
            right: 15px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            box-shadow: -6px 4px 0 0 #333;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Bagian Atas -->
        <div class="top-section">
            <div class="plant-pot"></div>
            
            <!-- Arch Frame dengan Gambar -->
            <div class="avatar-arch-frame">
                <img src="foto-profil.jpg" alt="Foto Profil">
            </div>
            
            <div class="lamp"></div>
        </div>

        <!-- Bagian Bawah -->
        <div class="bottom-section">
            <div class="illustration-box">
                [Sketsa Latar]
            </div>

            <div class="info">
                <p><strong>Nama:</strong> Cruz Pradana</p>
                <p><strong>Kelas:</strong> XI - F</p>
                <p><strong>Hobi:</strong> Menggambar, menulis cerita, bermain game</p>
            </div>

            <div class="faceless-moon"></div>
        </div>
    </div>

</body>
</html>
